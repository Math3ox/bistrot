[package]
name = "bistrot"
version = "1.0.0"
edition = "2021"
description = "Moteur commun des jeux de bistrot : fenetre, rendu processeur, table iso, cartes, interface, jeu en ligne"

[dependencies]
winit = "0.30"
tiny-skia = "0.11"
ab_glyph = "0.2"

# Windows : affichage direct par GDI ; ailleurs, softbuffer (X11 / Wayland)
[target.'cfg(not(windows))'.dependencies]
softbuffer = "0.4"
